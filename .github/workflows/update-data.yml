name: Refresh standings data
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update_data.py"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-standings-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_data.py
      - name: Create or update data pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sihf-data-refresh
          delete-branch: true
          add-paths: data/games.json
          commit-message: "Refresh SIHF Group 2 results"
          title: "Refresh SIHF Group 2 results"
          body: |
            Automated update of the Group 2 game results scraped from the official SIHF team schedules.

            This pull request is created or updated only when data/games.json differs from the current main branch.
